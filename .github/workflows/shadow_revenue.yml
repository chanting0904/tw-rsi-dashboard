name: 月營收影子紀錄
on:
  schedule:
    - cron: '0 4 * * 6'   # 台北週六 12:00：本週計畫已發布、週五收盤資料已更新
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: shadow-revenue
  cancel-in-progress: false
jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt
      - name: 安裝依賴
        run: pip install -q -r requirements.txt
      - name: 從 Release 下載資料庫
        env:
          GH_TOKEN: ${{ github.token }}
        run: python retry_runner.py -- python db_release.py download
      - name: 產生影子紀錄（研究用，不改正式計畫與 output/）
        run: python research_notes/shadow_revenue.py
      - name: 推送紀錄
        run: |
          git config user.name "rsi-bot"
          git config user.email "bot@rsi.local"
          git add research_notes/shadow_revenue.md research_notes/shadow_revenue.jsonl
          if ! git diff --cached --quiet; then
            git commit -m "research: 月營收影子紀錄 $(date -u +%F) [skip ci]"
            git pull --rebase --autostash
            git push
          fi
      - name: 失敗才告警
        if: failure()
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            --data-urlencode chat_id="${TG_CHAT_ID}" \
            --data-urlencode "text=⚠️ 月營收影子紀錄失敗（不影響選股）：${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" || true
