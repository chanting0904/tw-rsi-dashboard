name: Python pipeline checks
on:
  pull_request:
  push:
    branches: [main]
    paths: ['**.py', 'tests/**', 'requirements.txt', '.github/workflows/checks.yml']
permissions:
  contents: read
jobs:
  offline_checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - run: python check_version.py
      - run: python -m compileall -q .
      - run: python -m unittest discover -s tests -v
      - run: node --test tests/test_weekly_status.cjs
      - run: node --test tests/test_capital_preview.cjs

      - run: node --test tests/test_order_planner.cjs

      - run: node --test tests/test_browser_resilience.cjs
      - run: node --test tests/test_performance_ui.cjs

      - run: node --test tests/test_weekly_capital.cjs tests/test_weekly_capital_ui.cjs
