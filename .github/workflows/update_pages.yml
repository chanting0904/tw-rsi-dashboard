name: 更新選股器網頁
on:
  schedule:
    - cron: '0 22 * * 1-5'    # 每天 06:00 台北：判斷是否本週最後交易日→B3 完整流程＋TG推播＋/CASH（09:00 開盤掛單）
    - cron: '40 6 * * 1-5'   # 每天 14:40 台北：更新當日收盤股價（官方源→FinLab→yfinance）
  workflow_dispatch:
    inputs:
      mode:
        description: 更新模式
        required: false
        default: daily
        type: choice
        options:
          - daily
          - full
permissions:
  contents: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache finlab_db
        uses: actions/cache@v4
        with:
          path: finlab_db
          key: finlab-db-${{ github.run_id }}
          restore-keys: finlab-db-
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 安裝依賴
        run: pip install -q yfinance finlab pandas numpy
      - name: B3 完整流程（最後交易日 06:00，或手動 full）＋ TG 推播
        if: >
          (github.event_name == 'schedule' && github.event.schedule == '0 22 * * 1-5')
          || (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'full')
        env:
          FINLAB_TOKEN: ${{ secrets.FINLAB_TOKEN }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          FORCE_FULL: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: |
          python check_and_run.py
          python tw_stock_strategy_v7f.py
      - name: 更新收盤股價（官方源→FinLab→yfinance）
        if: >
          (github.event_name == 'schedule' && github.event.schedule == '40 6 * * 1-5')
          || github.event_name == 'workflow_dispatch'
        env:
          FINLAB_TOKEN: ${{ secrets.FINLAB_TOKEN }}
        run: python daily_update.py
      - name: 提交回 main（Pages 自動重建）
        run: |
          git config user.name "rsi-bot"
          git config user.email "bot@rsi.local"
          git add state.json index.html RSI選股器.html holidays.json check_and_run.py update_data.py tw_stock_strategy_v7f.py ai_monitor.py ai_signals.json b3_canonical.py local_db_updater.py daily_update.py output/
          git commit -m "auto update page [skip ci]" || echo "無變更"
          git push
