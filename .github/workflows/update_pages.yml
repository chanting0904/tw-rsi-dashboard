name: 更新選股器網頁
on:
  schedule:
    - cron: '45 13 * * 1-5'   # 台北21:45；僅最後交易日前一交易日發布，休市自動提前
    - cron: '0 22 * * 0-4'    # 台北週一至週五 06:00（UTC 前一天 22:00）
    - cron: '0 23 * * 0-4'    # 台北 07:00：僅本週最後交易日檢查與補做未完成部分
  workflow_dispatch:
    inputs:
      mode:
        description: 更新模式
        required: false
        default: daily
        type: choice
        options:
          - daily
          - full
  push:
    branches:
      - main
    paths:
      - 'output/latest_signals.json'   # 推送 canonical → 重建 Web（canonical 即 V5 結果，不重算）
      - 'output/previous_capital_signal.json'
      - 'update_data.py'               # 推送 Web 產生器 → 重建 Web
      - '.github/workflows/update_pages.yml'
      - 'weekly_status.js'
      - 'weekly_status.py'
      - 'retry_runner.py'
      - 'v5_engine/**'
      - 'v5_canonical.py'
      - 'capital_preview.js'
      - 'order_planner.js'
      - 'order_planner_ui.js'
      - 'weekly_capital.js'
      - 'weekly_capital_ui.js'
      - 'dashboard_ui.js'
      - 'dashboard_ui.css'
      - 'monthly_details.js'
      - 'performance_ui.js'
      - 'version.py'
      - 'VERSION_HISTORY.txt'
      - 'v5_baseline.json'
      - 'live_model_seed.json'
      - 'tg_push_v5.py'
      - 'publication_check.py'
      - 'recovery_check.py'
      - 'delivery_state.py'
      - 'pages_publish.py'
      - 'output/perf.json'
permissions:
  contents: write
  pages: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt
      # Recovery imports the same pandas/numpy modules as the main pipeline.
      - name: 安裝依賴
        run: pip install -q -r requirements.txt
      - name: 晚間發布及06:00／07:00核對本週完成狀態
        id: recovery
        if: github.event_name == 'schedule'
        run: |
          case '${{ github.event.schedule }}' in
            '45 13 * * 1-5') python recovery_check.py --evening ;;
            '0 22 * * 0-4') python recovery_check.py --daily ;;
            *) python recovery_check.py ;;
          esac
      - name: Cache finlab_db
        if: steps.recovery.outputs.mode != 'skip' && steps.recovery.outputs.mode != 'publish'
        uses: actions/cache@v4
        with:
          path: finlab_db
          key: finlab-db-v4-${{ github.run_id }}
          restore-keys: finlab-db-v4-
      - name: 更新收盤股價（官方源→FinLab→yfinance；每日 06:00 補昨日收盤）
        if: >
          (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
          && steps.recovery.outputs.mode != 'skip' && steps.recovery.outputs.mode != 'publish'
        env:
          FINLAB_TOKEN: ${{ secrets.FINLAB_TOKEN }}
        run: python retry_runner.py -- python daily_update.py
      - name: V5 晚間產生次交易日收盤計畫，早上僅補算未完成訊號
        if: >
          (github.event_name == 'schedule'
          || (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'full'))
          && steps.recovery.outputs.mode != 'skip' && steps.recovery.outputs.mode != 'publish'
          && steps.recovery.outputs.mode != 'daily'
        env:
          FINLAB_TOKEN: ${{ secrets.FINLAB_TOKEN }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          FORCE_FULL: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: |
          python retry_runner.py --weekly -- python check_and_run.py
      - name: 重建 Web（push 觸發，讀既有 canonical）
        if: github.event_name == 'push'
        env:
          FINLAB_TOKEN: ${{ secrets.FINLAB_TOKEN }}
        run: python retry_runner.py -- python update_data.py
      - name: 補做發布時恢復已驗證訊號狀態並重建網頁
        if: steps.recovery.outputs.mode == 'publish'
        env:
          V5_SKIP_LOCAL_UPDATE: '1'
        run: |
          python weekly_status.py ready
          python update_data.py
      - name: 提交網頁與本地價格庫回 main
        if: steps.recovery.outputs.mode != 'skip'
        run: |
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "主分支已有較新資料，略過這份過期部署"
            echo "V5_SKIP_DEPLOY=1" >> "$GITHUB_ENV"
            exit 0
          fi
          git config user.name "rsi-bot"
          git config user.email "bot@rsi.local"
          git add state.json index.html holidays.json check_and_run.py publish_gate.py update_data.py tg_push_v5.py v5_canonical.py local_db_updater.py daily_update.py local_db/ output/
          if ! git diff --cached --quiet; then
            git commit -m "auto update page [skip ci]"
            python retry_runner.py -- git pull --rebase
            python retry_runner.py -- git push
          fi
      - name: 明確要求 Pages 重建（bot 提交不會自行觸發 Pages）
        if: env.V5_SKIP_DEPLOY != '1' && steps.recovery.outputs.mode != 'skip'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python retry_runner.py -- python pages_publish.py
      - name: 網站上線後發送同一份 Telegram 訊號
        if: >
          env.V5_SKIP_DEPLOY != '1' && steps.recovery.outputs.mode != 'skip'
          && steps.recovery.outputs.mode != 'daily' && (github.event_name == 'schedule'
          || github.event_name == 'push'
          || (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'full'))
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          FORCE_FULL: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
          TG_PROGRESS_GIT: '1'
        run: python tg_push_v5.py
      - name: 保存公開核對結果及已確認的推播進度（失敗時也保留）
        if: always() && env.V5_SKIP_DEPLOY != '1' && steps.recovery.outputs.mode != 'skip'
        run: |
          git config user.name "rsi-bot"
          git config user.email "bot@rsi.local"
          git add state.json
          # The publication gate can also persist regression and fee baselines.
          for file in output/publication_verified.json output/regression_history.json output/baseline.json; do
            if [ -f "$file" ]; then git add -- "$file"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m "record publication and telegram delivery [skip ci]"
            python retry_runner.py -- git pull --rebase
            python retry_runner.py -- git push
          fi
      - name: 失敗狀態上網（保留上一份訊號）
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          V5_SKIP_LOCAL_UPDATE: '1'
        run: |
          python weekly_status.py failed
          python update_data.py || echo "網頁重建失敗，保留原頁面並單獨發布狀態檔"
          git config user.name "rsi-bot"
          git config user.email "bot@rsi.local"
          git add index.html
          if [ -f output/weekly_status.json ]; then
            git add output/weekly_status.json
          fi
          if ! git diff --cached --quiet; then
            git commit -m "record update failure [skip ci]"
            git pull --rebase --autostash
            git push
          fi
          python pages_publish.py
      - name: 重試仍失敗才告警（任一 step 最終失敗→TG 通知）
        if: failure()
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d chat_id="${TG_CHAT_ID}" \
            -d "text=❌ V5 自動化流程失敗：${GITHUB_WORKFLOW} #${GITHUB_RUN_NUMBER} 請查 GitHub Actions logs" \
            -d parse_mode=HTML || true
