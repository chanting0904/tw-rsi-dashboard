name: 更新選股器網頁
on:
  schedule:
    - cron: '0 22 * * 0-4'    # 台北週一至週五 06:00（UTC 前一天 22:00）
  workflow_dispatch:
    inputs:
      mode:
        description: 更新模式
        required: false
        default: daily
        type: choice
        options:
          - daily
          - full
  push:
    branches:
      - main
    paths:
      - 'output/latest_signals.json'   # 推送 canonical → 重建 Web（canonical 即 B3 結果，不重算）
      - 'update_data.py'               # 推送 Web 產生器 → 重建 Web
      - '.github/workflows/update_pages.yml'
      - 'weekly_status.js'
      - 'weekly_status.py'
      - 'retry_runner.py'
permissions:
  contents: write
  pages: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Cache finlab_db
        uses: actions/cache@v4
        with:
          path: finlab_db
          key: finlab-db-v2-${{ github.run_id }}
          restore-keys: finlab-db-
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 安裝依賴
        run: pip install -q -r requirements.txt
      - name: 更新收盤股價（官方源→FinLab→yfinance；每日 06:00 補昨日收盤）
        if: >
          (github.event_name == 'schedule' && github.event.schedule == '0 22 * * 0-4')
          || github.event_name == 'workflow_dispatch'
        env:
          FINLAB_TOKEN: ${{ secrets.FINLAB_TOKEN }}
        run: python retry_runner.py -- python daily_update.py
      - name: B3 收盤調倉計畫（本週最後交易日，使用前一交易日資料）
        if: >
          (github.event_name == 'schedule' && github.event.schedule == '0 22 * * 0-4')
          || (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'full')
        env:
          FINLAB_TOKEN: ${{ secrets.FINLAB_TOKEN }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          FORCE_FULL: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: |
          python retry_runner.py --weekly -- python check_and_run.py
      - name: 重建 Web（push 觸發，讀既有 canonical）
        if: github.event_name == 'push'
        env:
          FINLAB_TOKEN: ${{ secrets.FINLAB_TOKEN }}
        run: python retry_runner.py -- python update_data.py
      - name: 提交網頁與本地價格庫回 main
        run: |
          git config user.name "rsi-bot"
          git config user.email "bot@rsi.local"
          git add state.json index.html holidays.json check_and_run.py publish_gate.py update_data.py tg_push_b3.py ai_monitor.py ai_signals.json b3_canonical.py local_db_updater.py daily_update.py local_db/ output/
          if ! git diff --cached --quiet; then
            git commit -m "auto update page [skip ci]"
            git pull --rebase
            git push
          fi
      - name: 明確要求 Pages 重建（bot 提交不會自行觸發 Pages）
        env:
          GH_TOKEN: ${{ github.token }}
        run: python retry_runner.py -- python pages_publish.py
      - name: 網站上線後發送同一份 Telegram 訊號
        if: >
          github.event_name == 'schedule'
          || (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'full')
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          FORCE_FULL: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: python tg_push_b3.py
      - name: 保存成功推播的去重狀態
        run: |
          git add state.json
          if ! git diff --cached --quiet; then
            git commit -m "record telegram delivery [skip ci]"
            git pull --rebase
            git push
          fi
      - name: 失敗狀態上網（保留上一份訊號）
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          B3_SKIP_LOCAL_UPDATE: '1'
        run: |
          python weekly_status.py failed
          python update_data.py || echo "網頁重建失敗，保留原頁面並單獨發布狀態檔"
          git config user.name "rsi-bot"
          git config user.email "bot@rsi.local"
          git add index.html
          if [ -f output/weekly_status.json ]; then
            git add output/weekly_status.json
          fi
          if ! git diff --cached --quiet; then
            git commit -m "record update failure [skip ci]"
            git pull --rebase --autostash
            git push
          fi
          python pages_publish.py
      - name: 重試仍失敗才告警（任一 step 最終失敗→TG 通知）
        if: failure()
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d chat_id="${TG_CHAT_ID}" \
            -d "text=❌ B3 自動化流程失敗：${GITHUB_WORKFLOW} #${GITHUB_RUN_NUMBER} 請查 GitHub Actions logs" \
            -d parse_mode=HTML || true
