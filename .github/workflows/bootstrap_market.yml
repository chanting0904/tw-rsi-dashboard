name: V5 local database bootstrap
on:
  push:
    branches: [codex/v5-market-local]
permissions:
  contents: write
concurrency:
  group: local-database-bootstrap
  cancel-in-progress: false
jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -q -r requirements.txt
      - uses: actions/cache/restore@v4
        if: hashFiles('local_db/history_prices.sqlite3') == ''
        with:
          path: local_db/*.sqlite3
          key: local-market-bootstrap-${{ github.run_id }}
          restore-keys: local-market-bootstrap-
      - uses: actions/cache/restore@v4
        if: hashFiles('local_db/history_prices.sqlite3') == ''
        with:
          path: finlab_db
          key: seed-audit-${{ github.run_id }}
          restore-keys: finlab-db-v4-
      - name: Save published comparison inputs
        run: |
          cp output/perf.json /tmp/prior_perf.json
          cp output/latest_signals.json /tmp/prior_signal.json
      - name: Build durable history and refresh official inputs without a service login
        run: python sync_market.py --bootstrap finlab_db
      - uses: actions/cache/save@v4
        with:
          path: local_db/*.sqlite3
          key: local-market-bootstrap-${{ github.run_id }}
      - name: Run offline checks
        run: |
          python -m unittest discover -s tests -v
          node --test tests/test_weekly_status.cjs tests/test_capital_preview.cjs tests/test_order_planner.cjs tests/test_browser_resilience.cjs tests/test_weekly_capital.cjs tests/test_weekly_capital_ui.cjs tests/test_performance_ui.cjs tests/test_capital_carry.cjs
      - name: Produce candidate, check history, preserve prior published shares
        env:
          V5_SKIP_LOCAL_UPDATE: '1'
        run: |
          python daily_update.py
          python check_and_run.py
          python verify_market_data.py --baseline /tmp/prior_perf.json --previous /tmp/prior_signal.json
      - name: Save verified database and candidate on this branch
        run: |
          git config user.name rsi-bot
          git config user.email bot@rsi.local
          git add local_db/*.sqlite3 output/ index.html
          if ! git diff --cached --quiet; then
            git commit -m "Save verified local database and next plan [skip ci]"
            git -c core.compression=1 push origin HEAD
          fi
